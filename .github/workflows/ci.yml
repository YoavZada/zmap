name: CI

# The PR gate: lint + typecheck + unit tests + Playwright e2e against the
# built docs bundle.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm --filter zmapgl test:coverage

      - name: Build library
        run: pnpm build:lib

      - name: Size limit
        run: pnpm size

      - name: SSR import check
        run: |
          node --input-type=module -e "await import('./packages/zmap/dist/index.js'); console.log('esm import OK')"
          node -e "require('./packages/zmap/dist/index.cjs'); console.log('cjs require OK')"

      - name: 'Directive check ("use client" in dist)'
        run: |
          head -c 200 packages/zmap/dist/index.js  | grep -q '"use client"' || { echo 'missing "use client" in ESM'; exit 1; }
          head -c 200 packages/zmap/dist/index.cjs | grep -q '"use client"' || { echo 'missing "use client" in CJS'; exit 1; }

      - name: Next build (SSR smoke)
        run: pnpm --filter next-smoke build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: |
          VERSION=$(pnpm --filter @zmap/e2e exec node -e "console.log(require('@playwright/test/package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: pnpm --filter @zmap/e2e exec playwright install --with-deps chromium

      # Playwright's webServer builds the docs and serves the production
      # bundle (vite preview) because CI is set — PRs validate the real
      # artifact, not the dev server.
      - name: E2E
        id: e2e
        run: pnpm --filter @zmap/e2e exec playwright test

      - name: Upload Playwright report
        if: always() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tools/e2e/playwright-report/
            tools/e2e/test-results/
          retention-days: 7
