name: Deploy to GitHub Pages

# Publishes both demo apps to a single GitHub Pages site, assembled side by
# side under one repo subpath:
#   docs       → https://<owner>.github.io/zmap/
#   pathfinder → https://<owner>.github.io/zmap/pathfinder/
# Each app's cross-link points at the other's path, so you can navigate
# between them. Runs alongside the Netlify deploy (deploy.yml) — an additional
# public mirror, not a replacement.
#
# One-time setup: repo Settings → Pages → "Build and deployment" → Source:
# "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the build; pages/id-token are what the official deploy
# actions need (id-token is the OIDC handshake used by deploy-pages).
permissions:
  contents: read
  pages: write
  id-token: write

# Allow a single in-flight Pages deployment. Don't cancel one mid-publish — a
# half-finished Pages deploy is worse than waiting for it to settle.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Reads the version from the root package.json "packageManager" field.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # BASE_PATH must match each app's path on the shared Pages site so its
      # asset URLs (and, for docs, the client router's basename) resolve. The
      # cross-link env vars are the SIBLING app's path on this same site —
      # docs links to the pathfinder subpath, pathfinder links back to root.
      - name: Build docs
        run: pnpm --filter docs build
        env:
          BASE_PATH: /zmap/
          VITE_PATHFINDER_URL: /zmap/pathfinder/

      - name: Build pathfinder
        run: pnpm --filter pathfinder build
        env:
          BASE_PATH: /zmap/pathfinder/
          VITE_DOCS_URL: /zmap/

      # Assemble one site: docs at the root, pathfinder nested under it. Then
      # serve docs' index.html as 404.html — GitHub Pages has no SPA rewrite
      # rule (unlike Netlify's _redirects), so a deep link like /zmap/markers
      # falls through to it and boots the app for react-router (basename=/zmap)
      # to resolve client-side. pathfinder has no client routing, so its real
      # /zmap/pathfinder/index.html is served directly and needs no fallback.
      - name: Assemble site
        run: |
          mkdir -p apps/docs/dist/pathfinder
          cp -r apps/pathfinder/dist/. apps/docs/dist/pathfinder/
          cp apps/docs/dist/index.html apps/docs/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
