name: Deploy (production)

# Builds both apps and deploys each to its own Netlify site.
# Runs on every push to main; can also be triggered by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two production deploys run at once; cancel an in-flight one if a
# newer commit lands.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Reads the version from the root package.json "packageManager" field.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vite inlines VITE_* env vars at build time. Each app links to its
      # sibling's deployed URL; without these it falls back to the dev
      # localhost ports baked into the source. Set these as repo (or
      # production-environment) Actions *variables* — they're public URLs.
      - name: Build docs
        run: pnpm --filter docs build
        env:
          VITE_PATHFINDER_URL: ${{ vars.PATHFINDER_URL }}

      - name: Build pathfinder
        run: pnpm --filter pathfinder build
        env:
          VITE_DOCS_URL: ${{ vars.DOCS_URL }}

      # --filter picks which workspace package this deploy is for. The Netlify
      # CLI detects all three packages (zmapgl, docs, pathfinder) and refuses to
      # proceed without one. It selects the package, not the site (--site does
      # that); since the site has no build command and we pass no --build,
      # nothing is rebuilt — Netlify just uploads the prebuilt --dir.
      - name: Deploy docs to Netlify
        run: >
          pnpm --package=netlify-cli dlx netlify deploy
          --prod
          --filter docs
          --dir apps/docs/dist
          --site "$NETLIFY_DOCS_SITE_ID"
          --message "docs @ ${GITHUB_SHA::7}"
        env:
          NETLIFY_DOCS_SITE_ID: ${{ secrets.NETLIFY_DOCS_SITE_ID }}

      - name: Deploy pathfinder to Netlify
        run: >
          pnpm --package=netlify-cli dlx netlify deploy
          --prod
          --filter pathfinder
          --dir apps/pathfinder/dist
          --site "$NETLIFY_PATHFINDER_SITE_ID"
          --message "pathfinder @ ${GITHUB_SHA::7}"
        env:
          NETLIFY_PATHFINDER_SITE_ID: ${{ secrets.NETLIFY_PATHFINDER_SITE_ID }}
