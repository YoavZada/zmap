name: PR test generation

# On PRs to main that touch testable map surface (library components, docs
# demos/pages/blocks), a Gemini CLI agent injects missing data-testids into
# the changed files, generates Playwright specs under
# tools/e2e/tests/generated/ (tagged @generated — advisory in ci.yml until a
# reviewer promotes them), verifies they pass locally in this runner, and
# commits the result to the PR branch.
#
# Auth: GEMINI_API_KEY repo secret — a free Google AI Studio key works
# (https://aistudio.google.com/apikey). Free-tier quotas are per-minute and
# per-day, and one agentic run makes many model requests — a busy PR day can
# exhaust the daily quota, in which case this step fails harmlessly (the bot
# is advisory; nothing blocks). Uncomment `gemini_model` below to run on
# gemini-2.5-flash for more free-tier headroom at some quality cost.
#
# Known limitation: pushes made with the default GITHUB_TOKEN do not trigger
# new workflow runs (GitHub anti-recursion), so ci.yml will not re-run on the
# bot's commit automatically. The bot self-verifies its specs here; the next
# author push (or a manual re-run) picks them up in CI. To make bot pushes
# trigger CI, store a PAT as TESTGEN_PUSH_TOKEN and pass it to checkout.
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

concurrency:
  group: testgen-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  testgen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Forks: we can't push to their branches; skip cleanly.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      # Cheap guards before any LLM spend: never react to our own commits
      # (loop guard), and only run when the diff touches the testable
      # allowlist (map-surface code, excluding tests/styles).
      - name: Gate — loop guard + testable-diff allowlist
        id: gate
        run: |
          HEAD_MSG=$(git log -1 --pretty=%B)
          HEAD_AUTHOR=$(git log -1 --pretty=%an)
          if echo "$HEAD_MSG" | grep -qF "[skip-testgen]"; then
            echo "Head commit is a testgen commit — skipping (loop guard)."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$HEAD_AUTHOR" in
            github-actions*|*"[bot]"*)
              echo "Head commit authored by a bot — skipping (loop guard)."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          git fetch origin main --depth=1
          CHANGED=$(git diff --name-only origin/main...HEAD)
          TESTABLE=$(echo "$CHANGED" \
            | grep -E '^(packages/zmap/src/components/|apps/docs/src/(demos|pages|blocks)/)' \
            | grep -vE '\.test\.(ts|tsx)$|\.style\.ts$' || true)
          if [ -z "$TESTABLE" ]; then
            echo "No testable files changed — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            {
              echo "testable<<EOF"
              echo "$TESTABLE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.gate.outputs.skip == 'false'
        uses: pnpm/action-setup@v4

      - name: Set up Node
        if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        if: steps.gate.outputs.skip == 'false'
        id: playwright
        run: |
          VERSION=$(pnpm --filter @zmap/e2e exec node -e "console.log(require('@playwright/test/package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.gate.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.gate.outputs.skip == 'false'
        run: pnpm --filter @zmap/e2e exec playwright install --with-deps chromium

      # Commits the agent makes must carry the bot identity, or the loop
      # guard above won't recognize them on the next synchronize event.
      - name: Configure git identity
        if: steps.gate.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898024+github-actions[bot]@users.noreply.github.com"

      - name: Generate testids + e2e specs
        if: steps.gate.outputs.skip == 'false'
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GH_TOKEN: ${{ github.token }}
          # A fresh Actions checkout is an untrusted workspace, which makes the
          # CLI downgrade YOLO mode to interactive approval and then fail in a
          # headless run. Trust it so tool calls (bash, file edits) run
          # unattended. Safe here: forks are excluded by the job `if` guard, so
          # this only ever trusts our own repo's PR-branch checkout.
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # The CLI otherwise defaults to a newer model (gemini-3.5-flash) whose
          # free tier is ~5 requests/min with a small daily cap — too low for an
          # agentic run's dozens of calls. 2.5-flash has a separate, more
          # generous free quota. Still marginal: expect throttling and only a
          # handful of runs/day on the free tier.
          gemini_model: gemini-2.5-flash
          prompt: |
            Follow the instructions in .github/prompts/testgen.md exactly.

            PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
            Base: main  Head: ${{ github.event.pull_request.head.ref }}

            Changed testable files:
            ${{ steps.gate.outputs.testable }}
