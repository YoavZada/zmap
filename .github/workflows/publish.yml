name: Publish zmap to npm

# Cut a release from GitHub (Releases → Draft a new release) with a tag that
# matches packages/zmap's version, e.g. v0.2.0. Publishing the release runs
# this workflow: it gates on typecheck + tests, builds the library, and
# publishes it to npm. Can also be run by hand (workflow_dispatch).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance attestation

# Don't let two publishes race.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Guard against publishing a version that doesn't match the release tag.
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: |
          pkg="$(node -p "require('./packages/zmap/package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' (-> '$tag') does not match packages/zmap/package.json version '$pkg'. Bump the version in package.json, commit to main, then recreate the release."
            exit 1
          fi

      - name: Typecheck
        run: pnpm --filter zmap typecheck

      - name: Test
        run: pnpm --filter zmap test

      - name: Build library
        run: pnpm --filter zmap build

      # --access public is required for scoped packages (e.g. @you/zmap) and
      # harmless for unscoped names. --no-git-checks is needed because the
      # release checkout is in detached-HEAD state. --provenance attaches a
      # signed build attestation — it requires a PUBLIC repo; drop it if the
      # repo is private.
      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks --provenance
        working-directory: packages/zmap
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
